# ga-chatwork-reporter 専用 gitleaks 設定
# デフォルトルール（汎用シークレット）を継承し、本リポジトリ固有の混入だけを追加検出する。
#
# 方針: 実値を列挙しない（denylist ではなく構造的検出＋許可形の allowlist）。
# 構造的に書けない具体値は ~/.secrets/gate-patterns（追跡下に置かない）が持つ。
#
# **公開リポジトリなので許可形は private より狭い**。RFC 2606 の予約ドメインのみ。
#
# regex は自己不一致形（ブラケット挿入）で書く: 本ファイル自身が検出対象を平文で含むと
# ゲートが常時 FAIL する。

[extend]
useDefault = true

[[rules]]
id = "ga-chatwork-reporter-real-email"
description = "メールアドレス（許可形以外は実アドレスとみなす。半角/全角 ＠ 両対応）"
# 捕捉グループを使わない（(?:...) にする）。capture group があるとその中身が secret 扱いになり、
# allowlist の regexTarget="secret" が効かなくなる。
regex = '''[A-Za-z0-9._%+-]+(?:@|＠)[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''

  [[rules.allowlists]]
  description = "RFC 2606 の予約ドメインのみ（定義上実在しないため local-part は問わない）"
  regexTarget = "secret"
  regexes = [
    '''^[A-Za-z0-9._%+-]+(?:@|＠)example\.(com|org|net)$''',
    '''^[A-Za-z0-9._%+-]+(?:@|＠)[A-Za-z0-9.-]*\.(example|test|invalid|localhost)$''',
    # SSH の固定 URL。個人アドレスではない。完全一致のみ許可する
    '''^git(?:@|＠)github\.com$''',
  ]

[[rules]]
id = "ga-chatwork-reporter-api-token"
description = "Chatwork API トークン形（32 桁の小文字 hex）"
# 既定の generic-api-key は変数名の文脈が無いと拾わない。地の文への貼り付けや
# 引用符付きのコード例が素通しするため（2026-08-07 実測）、構造式で独立に拾う。
# keywords を置かない = 全チャンクに適用（プレフィルタで取りこぼさないため）。
regex = '''\b[0-9a-f]{32}\b'''

[[rules]]
id = "ga-chatwork-reporter-oauth-client-id-suffix"
description = "完全 OAuth client_id の混入検出"
regex = '''(?i)[0-9a-z\-]+\.apps\.googleuserconten[t]\.com'''
keywords = ["googleusercontent"]

# 数値 ID（room ID・account ID）は**構造式にしない**。桁数で拾うと誤検知が常態化し、
# ゲートを外す圧力に直結する。絶対に出てはいけない具体値だけを
# ~/.secrets/gate-patterns へ足して文字列検査側で捕まえる。
